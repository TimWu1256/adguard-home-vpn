services:
  # ──────────────────── Tailscale ──────────────────────
  tailscale:
    image: tailscale/tailscale
    container_name: tailscale
    volumes:
      - ./tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    ports:
      - 41641:41641/udp
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    command: tailscaled
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.20.0.2

  # ──────────────────── AdGuardHome ─────────────────────
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    volumes:
      - ./config:/opt/adguardhome/conf
      - ./data:/opt/adguardhome/work
    ports:
      - 127.0.0.1:53:53/tcp
      - 127.0.0.1:53:53/udp
      - 8080:80/tcp
      - 3000:3000/tcp
      - 853:853/tcp
      - 784:784/udp
      - 5443:5443/tcp
      - 5443:5443/udp
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.20.0.3
    upstream_dns:
      - 168.95.1.1
      - 101.101.101.101
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
      - https://dns10.quad9.net/dns-query
    upstream_mode: parallel_requests
    bootstrap_dns:
      - 168.95.1.1:53
      - 1.1.1.1:53
      - 8.8.8.8:53
    cache_size: 67108864
    cache_ttl_min: 300
    cache_ttl_max: 86400  
    cache_optimistic: true
    edns_client_subnet:
      enabled: true

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
